<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TD4 - Exo1 : Contrôle gestuel et vocal</title>
  <script src="https://unpkg.com/ml5@1/dist/ml5.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    a { position: absolute; top: 8px; left: 8px; color: #fff; z-index: 10; }
    #statut { position: absolute; top: 8px; right: 8px; color: #fff; background: #0008; padding: 6px 10px; border-radius: 4px; z-index: 10; }
    #apercu { position: absolute; bottom: 8px; right: 8px; width: 160px; height: 120px; border: 2px solid #fff; border-radius: 6px; overflow: hidden; z-index: 10; }
    #apercu video, #apercu canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; transform: scaleX(-1); }
    #commandeVocale { position: absolute; bottom: 8px; left: 8px; z-index: 10; display: flex; flex-direction: column; gap: 6px; max-width: calc(100vw - 190px); }
    #commandeVocale form { display: flex; gap: 6px; }
    #commandeVocale input { flex: 1; min-width: 0; padding: 8px; }
    #commandeVocale button { padding: 8px 12px; }
    #messageVoix { color: #fff; background: #0008; padding: 6px 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <a href="../">Retour</a>
  <div id="statut">Démarrage de la caméra...</div>

  <div id="commandeVocale">
    <div id="messageVoix">Dis un pays (ex : « Japon »)</div>
    <button id="btnMicro">🎤 Parler</button>
    <form id="formPays">
      <input id="champPays" type="text" placeholder="ou tape un pays">
      <button type="submit">Aller</button>
    </form>
  </div>

  <div id="apercu">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      75, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.z = 3;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 2));

    const textureTerre = new THREE.TextureLoader().load(
      "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
    );
    const terre = new THREE.Mesh(
      new THREE.SphereGeometry(1, 64, 64),
      new THREE.MeshStandardMaterial({ map: textureTerre })
    );
    scene.add(terre);

    function latLonVersCartesien(lat, lon, rayon) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);

      return new THREE.Vector3(
        -rayon * Math.sin(phi) * Math.cos(theta),
        rayon * Math.cos(phi),
        rayon * Math.sin(phi) * Math.sin(theta)
      );
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((position) => {
        const { latitude, longitude } = position.coords;
        const marqueur = new THREE.Mesh(
          new THREE.SphereGeometry(0.02, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0xff0000 })
        );
        marqueur.position.copy(latLonVersCartesien(latitude, longitude, 1.02));
        terre.add(marqueur);
      });
    }

    const CLE_API_RESTCOUNTRIES = "rc_live_e4202a7ad1a7455ead2a6a255887764a";
    const codesAlpha3 = [
      "FRA", "USA", "JPN", "BRA", "AUS", "EGY",
      "CAN", "DEU", "GBR", "ITA", "ESP", "IND",
      "CHN", "RUS", "ZAF", "MEX", "ARG", "KOR"
    ];
    const chargeurTexture = new THREE.TextureLoader();
    const coordonneesPays = {};

    function placerDrapeau(lat, lon, urlImage) {
      const drapeau = new THREE.Mesh(
        new THREE.PlaneGeometry(0.15, 0.1),
        new THREE.MeshBasicMaterial({
          map: chargeurTexture.load(urlImage),
          side: THREE.DoubleSide,
          transparent: true
        })
      );
      const position = latLonVersCartesien(lat, lon, 1.05);
      drapeau.position.copy(position);
      drapeau.lookAt(position.clone().multiplyScalar(2));
      terre.add(drapeau);
    }

    function attendre(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function recupererPays(code) {
      const cle = "paysV2_" + code;
      const enCache = localStorage.getItem(cle);
      if (enCache) return JSON.parse(enCache);

      const reponse = await fetch(
        "https://api.restcountries.com/countries/v5/code?q=" + code
          + "&limit=1&response_fields=coordinates.lat,coordinates.lng,codes.alpha_2",
        { headers: { Authorization: "Bearer " + CLE_API_RESTCOUNTRIES } }
      ).then((r) => r.json());

      const pays = reponse.data?.objects?.[0];
      if (pays) localStorage.setItem(cle, JSON.stringify(pays));
      return pays;
    }

    async function chargerLesPays() {
      for (const code of codesAlpha3) {
        try {
          const pays = await recupererPays(code);
          if (pays) {
            coordonneesPays[code] = { lat: pays.coordinates.lat, lon: pays.coordinates.lng };
            const urlDrapeau = "https://flagcdn.com/w320/" + pays.codes.alpha_2.toLowerCase() + ".png";
            placerDrapeau(pays.coordinates.lat, pays.coordinates.lng, urlDrapeau);
          }
        } catch {
          console.warn("Impossible de récupérer le pays " + code + " via api.restcountries.com.");
        }
        await attendre(600);
      }
    }
    chargerLesPays();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const statut = document.getElementById("statut");
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");

    let mains = [];
    let positionPrecedente = null;
    const SENSIBILITE = 4;

    function tournerAvecLaMain() {
      const centreMain = mains[0].keypoints[9];
      const x = centreMain.x / video.videoWidth;
      const y = centreMain.y / video.videoHeight;

      if (positionPrecedente) {
        terre.rotation.y -= (x - positionPrecedente.x) * SENSIBILITE;
        terre.rotation.x += (y - positionPrecedente.y) * SENSIBILITE;
        terre.rotation.x = THREE.MathUtils.clamp(terre.rotation.x, -Math.PI / 2, Math.PI / 2);
      }
      positionPrecedente = { x, y };
    }

    const ZOOM_MIN = 1.6;
    const ZOOM_MAX = 4.5;
    let distanceCible = camera.position.z;

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function zoomerAvecLePincement() {
      const points = mains[0].keypoints;
      const ecartPouceIndex = distance(points[4], points[8]);
      const tailleMain = distance(points[0], points[9]);
      const ouverture = THREE.MathUtils.clamp(ecartPouceIndex / tailleMain, 0.15, 1);

      distanceCible = THREE.MathUtils.mapLinear(ouverture, 0.15, 1, ZOOM_MAX, ZOOM_MIN);
    }

    let cibleRotation = null;
    let rotationEnPause = false;

    function allerVers(lat, lon) {
      const point = latLonVersCartesien(lat, lon, 1);
      cibleRotation = {
        x: THREE.MathUtils.degToRad(lat),
        y: -Math.atan2(point.x, point.z)
      };
      distanceCible = 2;
    }

    function ecartAngle(depart, arrivee) {
      return THREE.MathUtils.euclideanModulo(arrivee - depart + Math.PI, Math.PI * 2) - Math.PI;
    }

    function tournerVersLaCible() {
      const dx = ecartAngle(terre.rotation.x, cibleRotation.x);
      const dy = ecartAngle(terre.rotation.y, cibleRotation.y);
      terre.rotation.x += dx * 0.08;
      terre.rotation.y += dy * 0.08;

      if (Math.abs(dx) < 0.005 && Math.abs(dy) < 0.005) {
        cibleRotation = null;
        rotationEnPause = true;
      }
    }

    function animate() {
      if (cibleRotation) {
        positionPrecedente = null;
        tournerVersLaCible();
      } else if (mains.length > 0) {
        rotationEnPause = false;
        tournerAvecLaMain();
        zoomerAvecLePincement();
      } else {
        positionPrecedente = null;
        if (!rotationEnPause) terre.rotation.y += 0.002;
      }
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, distanceCible, 0.1);
      renderer.render(scene, camera);
    }
    renderer.setAnimationLoop(animate);

    const nomsPays = {
      FRA: ["france"],
      USA: ["etats-unis", "etats unis", "amerique", "usa"],
      JPN: ["japon"],
      BRA: ["bresil"],
      AUS: ["australie"],
      EGY: ["egypte"],
      CAN: ["canada"],
      DEU: ["allemagne"],
      GBR: ["royaume-uni", "royaume uni", "angleterre", "grande-bretagne", "grande bretagne"],
      ITA: ["italie"],
      ESP: ["espagne"],
      IND: ["inde"],
      CHN: ["chine"],
      RUS: ["russie"],
      ZAF: ["afrique du sud"],
      MEX: ["mexique"],
      ARG: ["argentine"],
      KOR: ["coree du sud", "coree"]
    };

    const messageVoix = document.getElementById("messageVoix");

    function normaliser(texte) {
      return texte.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
    }

    function trouverPays(texte) {
      const phrase = " " + normaliser(texte) + " ";
      for (const [code, noms] of Object.entries(nomsPays)) {
        if (noms.some((nom) => phrase.includes(" " + nom + " "))) return code;
      }
      return null;
    }

    function traiterDemande(texte) {
      const code = trouverPays(texte);
      if (!code) {
        messageVoix.textContent = "« " + texte + " » : pays non reconnu.";
        return;
      }
      const coords = coordonneesPays[code];
      if (!coords) {
        messageVoix.textContent = "Les données de ce pays ne sont pas encore chargées, réessaie dans un instant.";
        return;
      }
      messageVoix.textContent = "Direction " + nomsPays[code][0] + " !";
      allerVers(coords.lat, coords.lon);
    }

    document.getElementById("formPays").addEventListener("submit", (e) => {
      e.preventDefault();
      const champ = document.getElementById("champPays");
      if (champ.value.trim()) traiterDemande(champ.value);
      champ.value = "";
    });

    const btnMicro = document.getElementById("btnMicro");
    const Reconnaissance = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!Reconnaissance) {
      btnMicro.style.display = "none";
      messageVoix.textContent = "Reconnaissance vocale non supportée ici : tape un pays.";
    } else {
      const reconnaissance = new Reconnaissance();
      reconnaissance.lang = "fr-FR";
      reconnaissance.interimResults = false;
      reconnaissance.maxAlternatives = 3;

      reconnaissance.addEventListener("result", (e) => {
        const alternatives = Array.from(e.results[0]).map((alt) => alt.transcript);
        const comprise = alternatives.find((texte) => trouverPays(texte)) || alternatives[0];
        traiterDemande(comprise);
      });

      reconnaissance.addEventListener("error", (e) => {
        messageVoix.textContent = "Erreur micro : " + e.error;
      });

      reconnaissance.addEventListener("end", () => {
        btnMicro.textContent = "🎤 Parler";
      });

      btnMicro.addEventListener("click", () => {
        messageVoix.textContent = "Je t'écoute...";
        btnMicro.textContent = "🎙️ ...";
        try {
          reconnaissance.start();
        } catch {
          reconnaissance.stop();
        }
      });
    }

    navigator.mediaDevices.getUserMedia({ video: true })
      .then((flux) => {
        video.srcObject = flux;
        video.addEventListener("loadedmetadata", () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          demarrerDetection();
        });
      })
      .catch((err) => {
        statut.textContent = "Caméra indisponible : " + err.message;
      });

    async function demarrerDetection() {
      if (typeof ml5 === "undefined") {
        statut.textContent = "ml5.js n'a pas pu se charger (22 Mo, vérifie ta connexion).";
        return;
      }
      statut.textContent = "Chargement du modèle IA (peut prendre un moment sur mobile)...";
      try {
        const detecteur = await ml5.handPose({ runtime: "mediapipe", modelType: "lite", maxHands: 1 });
        detecteur.detectStart(video, (resultats) => {
          mains = resultats;
        });
        dessinerMains();
      } catch (err) {
        statut.textContent = "Erreur de chargement du modèle : " + err.message;
      }
    }

    function dessinerMains() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const main of mains) {
        for (const point of main.keypoints) {
          ctx.beginPath();
          ctx.arc(point.x, point.y, 6, 0, Math.PI * 2);
          ctx.fillStyle = "#00ff88";
          ctx.fill();
        }
        const pouce = main.keypoints[4];
        const index = main.keypoints[8];
        ctx.beginPath();
        ctx.moveTo(pouce.x, pouce.y);
        ctx.lineTo(index.x, index.y);
        ctx.strokeStyle = "#ff3333";
        ctx.lineWidth = 6;
        ctx.stroke();
      }

      statut.textContent = "Mains détectées : " + mains.length;
      requestAnimationFrame(dessinerMains);
    }
  </script>
</body>
</html>
