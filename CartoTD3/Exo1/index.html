<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TD3 - Exo1 : Géolocalisation et 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    a { position: absolute; top: 8px; left: 8px; color: #fff; font-family: Arial, sans-serif; z-index: 10; }
  </style>
</head>
<body>
  <a href="../">Retour</a>
  <div id="statut" style="position:absolute; top:8px; right:8px; z-index:10; color:#fff; font-family:Arial, sans-serif; background:#0008; padding:6px 10px; border-radius:4px;">
    Recherche de la position...
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      75, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.z = 3;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 2));

    const textureTerre = new THREE.TextureLoader().load(
      "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
    );
    const terre = new THREE.Mesh(
      new THREE.SphereGeometry(1, 64, 64),
      new THREE.MeshStandardMaterial({ map: textureTerre })
    );
    scene.add(terre);

    function latLonVersCartesien(lat, lon, rayon) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);

      return new THREE.Vector3(
        -rayon * Math.sin(phi) * Math.cos(theta),
        rayon * Math.cos(phi),
        rayon * Math.sin(phi) * Math.sin(theta)
      );
    }

    const statut = document.getElementById("statut");

    function afficherMaPosition(position) {
      const { latitude, longitude } = position.coords;

      const marqueur = new THREE.Mesh(
        new THREE.SphereGeometry(0.02, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xff0000 })
      );
      marqueur.position.copy(latLonVersCartesien(latitude, longitude, 1.02));
      terre.add(marqueur);

      statut.textContent = "Ma position : " + latitude.toFixed(2) + ", " + longitude.toFixed(2);
    }

    function erreurPosition(err) {
      statut.textContent = "Géolocalisation indisponible (erreur " + err.code + ").";
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(afficherMaPosition, erreurPosition, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    } else {
      statut.textContent = "La géolocalisation n'est pas supportée par ce navigateur.";
    }

    const pays = [
      { code: "fr", lat: 48.8566, lon: 2.3522 },
      { code: "us", lat: 38.9072, lon: -77.0369 },
      { code: "jp", lat: 35.6762, lon: 139.6503 },
      { code: "br", lat: -15.7939, lon: -47.8828 },
      { code: "au", lat: -35.2809, lon: 149.1300 },
      { code: "eg", lat: 30.0444, lon: 31.2357 }
    ];

    const chargeurTexture = new THREE.TextureLoader();
    for (const p of pays) {
      const drapeau = new THREE.Mesh(
        new THREE.PlaneGeometry(0.15, 0.1),
        new THREE.MeshBasicMaterial({
          map: chargeurTexture.load("https://flagcdn.com/w320/" + p.code + ".png"),
          side: THREE.DoubleSide,
          transparent: true
        })
      );

      const position = latLonVersCartesien(p.lat, p.lon, 1.05);
      drapeau.position.copy(position);
      drapeau.lookAt(position.clone().multiplyScalar(2));
      terre.add(drapeau);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      terre.rotation.y += 0.002;
      renderer.render(scene, camera);
    }
    renderer.setAnimationLoop(animate);
  </script>
</body>
</html>
