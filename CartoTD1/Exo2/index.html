<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TD1 - Exo2 : Leaflet et géolocalisation</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 16px; background: #fafafa; }
    h1 { font-size: 1.3rem; }
    .bloc { background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    .erreur { color: #b00; }
    #carte { width: 100%; max-width: 900px; height: 500px; border: 2px solid #888; border-radius: 6px; }
    a { display: inline-block; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Exercice 2 - Leaflet et sa propre géolocalisation</h1>
  <div class="bloc" id="statut">Recherche de la position...</div>

  <div id="carte"></div>

  <a href="../">Retour</a>

  <script>
    const NICE = [43.7102, 7.2620];
    const MARSEILLE = [43.2965, 5.3698];

    const BERMUDES = [
      [25.7617, -80.1918], // Miami
      [32.3078, -64.7505], // Bermudes
      [18.4655, -66.1057]  // San Juan
    ];

    const carte = L.map("carte").setView(NICE, 8);

    const fondOSM = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(carte);

    const STADIA_KEY = "eed6a6b4-d171-43e4-8215-e5f8490b4245";

    const fondStamen = L.tileLayer(
      "https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg?api_key=" + STADIA_KEY,
      {
        maxZoom: 16,
        attribution: "&copy; Stadia Maps, &copy; Stamen Design, &copy; OpenStreetMap"
      }
    );

    L.control.layers({
      "OpenStreetMap": fondOSM,
      "Stamen Watercolor": fondStamen
    }).addTo(carte);

  
    L.marker(NICE).addTo(carte).bindPopup("Nice (centre ville)");

    L.polygon(BERMUDES, { color: "red" }).addTo(carte).bindPopup("Triangle des Bermudes");

    function distanceKm([lat1, lon1], [lat2, lon2]) {
      const R = 6371; // rayon terrestre moyen en km
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    L.polyline([MARSEILLE, NICE], { color: "blue", dashArray: "6 6" }).addTo(carte)
      .bindPopup("Marseille - Nice : " + distanceKm(MARSEILLE, NICE).toFixed(1) + " km");

    fetch("https://geo.api.gouv.fr/communes/06088?format=geojson&geometry=contour")
      .then(r => r.json())
      .then(geojson => {
        L.geoJSON(geojson, { style: { color: "green", weight: 2, fillOpacity: 0.1 } })
          .addTo(carte)
          .bindPopup("Contour de Nice (GeoJSON, geo.api.gouv.fr)");
      })
      .catch(() => console.warn("GeoJSON commune de Nice indisponible."));

    const urlOSRM = "https://router.project-osrm.org/route/v1/driving/"
      + NICE[1] + "," + NICE[0] + ";" + MARSEILLE[1] + "," + MARSEILLE[0]
      + "?overview=full&geometries=geojson";

    fetch(urlOSRM)
      .then(r => r.json())
      .then(data => {
        if (!data.routes || !data.routes.length) return;
        const trajet = data.routes[0];
        L.geoJSON(trajet.geometry, { style: { color: "orange", weight: 4 } })
          .addTo(carte)
          .bindPopup("Trajet Nice - Marseille : " + (trajet.distance / 1000).toFixed(1)
            + " km, " + Math.round(trajet.duration / 60) + " min");
      })
      .catch(() => console.warn("Itinéraire OSRM indisponible."));

    const statut = document.getElementById("statut");

    function afficherMaPosition(position) {
      const { latitude, longitude, accuracy } = position.coords;
      const moi = [latitude, longitude];

      carte.setView(moi, 13);
      L.marker(moi).addTo(carte).bindPopup("Ma position").openPopup();

      L.circle(moi, {
        radius: accuracy,
        color: "#3388ff",
        fillOpacity: 0.15
      }).addTo(carte).bindPopup("Précision estimée : " + accuracy.toFixed(0) + " m");

      statut.innerHTML = "Position trouvée. Distance à Marseille : "
        + distanceKm(moi, MARSEILLE).toFixed(1) + " km.";
    }

    function erreurPosition(err) {
      statut.innerHTML = "<span class='erreur'>Géolocalisation indisponible (erreur "
        + err.code + "). Carte centrée sur Nice par défaut.</span>";
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(afficherMaPosition, erreurPosition, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    } else {
      statut.innerHTML = "<span class='erreur'>La géolocalisation n'est pas supportée par ce navigateur.</span>";
    }
  </script>
</body>
</html>
