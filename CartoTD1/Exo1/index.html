<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TD1 - Exo1 : Géolocalisation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; background: #fafafa; }
    h1 { font-size: 1.3rem; }
    h2 { font-size: 1.1rem; margin-top: 1.5rem; }
    h3 { font-size: 1rem; margin-bottom: 4px; }
    .bloc { background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    table { border-collapse: collapse; width: 100%; }
    td { padding: 4px 8px; border-bottom: 1px solid #eee; }
    td:first-child { color: #555; width: 45%; }
    .erreur { color: #b00; }
    button { padding: 8px 14px; margin-right: 8px; }
    a { display: inline-block; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Exercice 1 - Accès à la géolocalisation</h1>

  <div>
    <button id="btnStop">Arrêter le suivi (watchPosition)</button>
  </div>

  <h2>Position ponctuelle (getCurrentPosition)</h2>
  <div class="bloc" id="blocCurrent">En attente...</div>

  <h2>Suivi en continu (watchPosition)</h2>
  <div class="bloc" id="blocWatch">En attente...</div>

  <h2>Capteurs</h2>
  <button id="btnCapteurs">Activer les capteurs</button>

  <h3>Orientation (DeviceOrientation)</h3>
  <div class="bloc" id="blocOrientation">En attente...</div>

  <h3>Mouvement (DeviceMotion)</h3>
  <div class="bloc" id="blocMotion">En attente...</div>

  <a href="../">Retour</a>

  <script>
    // options communes 
    const options = {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    };

    // tableau lisible à partir d'un objet Position
    function afficherPosition(position) {
      const c = position.coords;
      const date = new Date(position.timestamp); //timestamp en ms

      const lignes = [
        ["Latitude", c.latitude + " °"],
        ["Longitude", c.longitude + " °"],
        ["Altitude", c.altitude === null ? "non disponible" : c.altitude.toFixed(1) + " m"],
        ["Précision (position)", c.accuracy.toFixed(1) + " m"],
        ["Précision (altitude)", c.altitudeAccuracy === null ? "non disponible" : c.altitudeAccuracy.toFixed(1) + " m"],
        ["Vitesse", c.speed === null ? "non disponible" : (c.speed * 3.6).toFixed(1) + " km/h"],
        ["Date de la mesure", date.toLocaleString("fr-FR")]
      ];

      let html = "<table>";
      for (const [nom, valeur] of lignes) {
        html += "<tr><td>" + nom + "</td><td>" + valeur + "</td></tr>";
      }
      html += "</table>";
      return html;
    }

    function messageErreur(err) {
      // codes erreur de l'API : 1 permission, 2 indisponible, 3 timeout
      return "<span class='erreur'>Erreur " + err.code + " : " + err.message + "</span>";
    }

    const blocCurrent = document.getElementById("blocCurrent");
    const blocWatch = document.getElementById("blocWatch");

    if (!navigator.geolocation) {
      blocCurrent.innerHTML = "<span class='erreur'>La géolocalisation n'est pas supportée par ce navigateur.</span>";
      blocWatch.innerHTML = blocCurrent.innerHTML;
    } else {
      // 1) une seule mesure
      navigator.geolocation.getCurrentPosition(
        function (position) {
          blocCurrent.innerHTML = afficherPosition(position);
        },
        function (err) {
          blocCurrent.innerHTML = messageErreur(err);
        },
        options
      );

      // 2) suivi : le callback est rappelé à chaque nouvelle position
      const watchId = navigator.geolocation.watchPosition(
        function (position) {
          blocWatch.innerHTML = afficherPosition(position);
        },
        function (err) {
          blocWatch.innerHTML = messageErreur(err);
        },
        options
      );

      document.getElementById("btnStop").addEventListener("click", function () {
        navigator.geolocation.clearWatch(watchId);
        blocWatch.innerHTML += "<p>Suivi arrêté.</p>";
      });
    }


    //DeviceOrientation et DeviceMotion

    const blocOrientation = document.getElementById("blocOrientation");
    const blocMotion = document.getElementById("blocMotion");

    //formater un nombre qui peut être null
    function num(v) {
      return (v === null || v === undefined) ? "non disponible" : v.toFixed(2);
    }

    function tableau(lignes) {
      let html = "<table>";
      for (const [nom, valeur] of lignes) {
        html += "<tr><td>" + nom + "</td><td>" + valeur + "</td></tr>";
      }
      return html + "</table>";
    }

    function onOrientation(e) {
      // alpha : rotation autour de l'axe z (boussole), beta : avant/arrière, gamma : gauche/droite
      blocOrientation.innerHTML = tableau([
        ["alpha (°)", num(e.alpha)],
        ["beta (°)", num(e.beta)],
        ["gamma (°)", num(e.gamma)],
        ["absolue ?", e.absolute]
      ]);
    }

    function onMotion(e) {
      const a = e.acceleration || {};
      const ag = e.accelerationIncludingGravity || {};
      const r = e.rotationRate || {};
      blocMotion.innerHTML = tableau([
        ["accélération x / y / z (m/s²)", num(a.x) + " / " + num(a.y) + " / " + num(a.z)],
        ["avec gravité x / y / z (m/s²)", num(ag.x) + " / " + num(ag.y) + " / " + num(ag.z)],
        ["vitesse de rotation alpha / beta / gamma (°/s)", num(r.alpha) + " / " + num(r.beta) + " / " + num(r.gamma)],
        ["intervalle (ms)", num(e.interval)]
      ]);
    }

    function activerCapteurs() {
      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission().then(function (reponse) {
          if (reponse === "granted") {
            window.addEventListener("deviceorientation", onOrientation);
          } else {
            blocOrientation.innerHTML = "<span class='erreur'>Permission refusée.</span>";
          }
        });
        DeviceMotionEvent.requestPermission().then(function (reponse) {
          if (reponse === "granted") {
            window.addEventListener("devicemotion", onMotion);
          } else {
            blocMotion.innerHTML = "<span class='erreur'>Permission refusée.</span>";
          }
        });
      } else {
        window.addEventListener("deviceorientation", onOrientation);
        window.addEventListener("devicemotion", onMotion);
      }
    }

    document.getElementById("btnCapteurs").addEventListener("click", activerCapteurs);
  </script>
</body>
</html>
